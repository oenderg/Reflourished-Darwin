name: Watch game updates

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: watch-game
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/watch-game.py
        env:
          GH_TOKEN: ${{ github.token }}
